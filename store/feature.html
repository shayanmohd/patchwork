<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Display"; src: url("display.ttf") format("truetype"); font-weight: 600; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  .stage {
    position: relative; width: 1024px; height: 500px; display: flex; align-items: center;
    background:
      radial-gradient(62% 96% at 26% 48%, #17786C 0%, #0C554D 42%, transparent 78%),
      linear-gradient(118deg, #0E5F56 0%, #0A4640 46%, #052925 100%);
    font-family: "Source", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  /* the weave, the same cloth the icon is sewn onto */
  .stage::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, #9FEEDC0A 0 1px, transparent 1px 7px),
      repeating-linear-gradient(90deg, #9FEEDC08 0 1px, transparent 1px 7px);
  }
  /* warm light through the cloth, behind the block */
  .stage::after {
    content: ''; position: absolute; left: 40px; top: 30px; width: 520px; height: 460px;
    background: radial-gradient(circle at 50% 46%, #FFD97A63 0%, #E0A52633 38%, transparent 70%);
  }
  .mark { position: relative; z-index: 2; margin-left: 74px; flex: none; }
  .words { position: relative; z-index: 2; margin-left: 56px; }
  .tack { width: 62px; height: 3px; border-radius: 2px; margin-bottom: 26px;
    background-image: repeating-linear-gradient(90deg, #F3C868 0 9px, transparent 9px 16px); }
  h1 { font-family: "Display", Georgia, serif; font-weight: 600; font-size: 108px; line-height: 1;
    color: #FBF6E8; letter-spacing: -0.028em; }
  p { font-family: "Display", Georgia, serif; font-weight: 600; font-size: 29px; line-height: 1.34;
    color: #9FE2D2; margin-top: 22px; max-width: 470px; letter-spacing: -0.004em; }
  p b { color: #F3C868; font-weight: 600; }
  /* loose stitches tacking the cloth down, as in the icon */
  /* one loose stitch tacking the cloth, low and quiet, as in the icon */
  .tack-br { position: absolute; right: 78px; bottom: 54px; width: 112px; height: 3px; z-index: 1;
    background-image: repeating-linear-gradient(90deg, #7FE0CB33 0 9px, transparent 9px 17px); }
</style></head>
<body>
<div class="stage">
  <svg class="mark" width="352" height="352" viewBox="18 18 72 72">
    <defs>
      <linearGradient id="tA" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#54C6B2"/><stop offset="1" stop-color="#1D8377"/></linearGradient>
      <linearGradient id="tB" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#7FE0CB"/><stop offset="1" stop-color="#2FA290"/></linearGradient>
      <linearGradient id="gA" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#F7CE66"/><stop offset="1" stop-color="#C68A0E"/></linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#E9B845"/><stop offset="1" stop-color="#A96F07"/></linearGradient>
      <filter id="c" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/><feOffset dy="2.8" result="o"/>
        <feFlood flood-color="#02201D" flood-opacity="0.6"/><feComposite in2="o" operator="in"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <g id="s"><rect x="-10.5" y="-10.5" width="21" height="21" rx="3.6"/></g>
    </defs>
    <g filter="url(#c)">
      <g transform="translate(41.4 41.4)"><use href="#s" fill="url(#tA)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#EAFBF6"
          stroke-opacity="0.62" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.1" stroke-linecap="round"/></g>
      <g transform="translate(66.6 41.4)"><use href="#s" fill="url(#gA)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#3A2A05"
          stroke-opacity="0.45" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFF" stroke-opacity="0.5" stroke-width="1.1" stroke-linecap="round"/></g>
      <g transform="translate(41.4 66.6)"><use href="#s" fill="url(#gB)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#3A2A05"
          stroke-opacity="0.45" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFF" stroke-opacity="0.42" stroke-width="1.1" stroke-linecap="round"/></g>
      <g transform="translate(66.6 66.6) rotate(25)"><use href="#s" fill="url(#tB)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#08322C"
          stroke-opacity="0.5" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFF" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round"/></g>
    </g>
  </svg>
  <div class="words">
    <div class="tack"></div>
    <h1>Patchwork</h1>
    <p>An hour for an hour. The time bank ledger for a group that already meets.</p>
  </div>
</div>
</body></html>
