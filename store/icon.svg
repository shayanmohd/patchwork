<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- the cloth the patches are sewn onto -->
    <linearGradient id="cloth" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#126E63"/>
      <stop offset="0.55" stop-color="#0B4F48"/>
      <stop offset="1" stop-color="#07332F"/>
    </linearGradient>
    <!-- warm light coming through the weave from behind the block -->
    <radialGradient id="lamp" cx="0.5" cy="0.46" r="0.56">
      <stop offset="0" stop-color="#FFD97A" stop-opacity="0.52"/>
      <stop offset="0.44" stop-color="#E0A526" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D99A22" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tealA" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#54C6B2"/><stop offset="1" stop-color="#1D8377"/>
    </linearGradient>
    <linearGradient id="tealB" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7FE0CB"/><stop offset="1" stop-color="#2FA290"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F7CE66"/><stop offset="1" stop-color="#C68A0E"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E9B845"/><stop offset="1" stop-color="#A96F07"/>
    </linearGradient>

    <!-- the whole region, or the shadow is clipped into a hard rectangle -->
    <filter id="cast" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="2.8" result="o"/>
      <feFlood flood-color="#02201D" flood-opacity="0.62"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- one patch, drawn once: cloth, a running stitch inside it, a lit top edge -->
    <g id="sq">
      <rect x="-10.5" y="-10.5" width="21" height="21" rx="3.6"/>
    </g>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#cloth)"/>
    <rect width="108" height="108" fill="url(#lamp)"/>
    <!-- the weave, two thread directions, barely there -->
    <g stroke="#9FEEDC" stroke-opacity="0.028" stroke-width="0.5">
      <path d="M0 6h108M0 14h108M0 22h108M0 30h108M0 38h108M0 46h108M0 54h108M0 62h108M0 70h108M0 78h108M0 86h108M0 94h108M0 102h108"/>
      <path d="M6 0v108M14 0v108M22 0v108M30 0v108M38 0v108M46 0v108M54 0v108M62 0v108M70 0v108M78 0v108M86 0v108M94 0v108M102 0v108"/>
    </g>
    <!-- loose stitches in the corners of the cloth, the way a quilt is tacked down -->
    <g stroke="#F3C868" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"
       stroke-dasharray="3 4.5">
      <path d="M9 15h17"/><path d="M82 93h17"/>
    </g>
    <g stroke="#7FE0CB" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round"
       stroke-dasharray="3 4.5">
      <path d="M93 12v16"/><path d="M15 80v16"/>
    </g>
  </g>

  <!-- four patches, one turned. Everything sits inside the r=33 safe circle. -->
  <g id="fg">
    <!-- the light the block sits in -->
    <circle cx="54" cy="53" r="26" fill="#FFD97A" opacity="0.22" filter="url(#bloom)"/>

    <g filter="url(#cast)">
      <!-- top left: teal -->
      <g transform="translate(41.4 41.4)">
        <use href="#sq" fill="url(#tealA)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#EAFBF6"
              stroke-opacity="0.62" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"
              stroke-width="1.1" stroke-linecap="round"/>
      </g>
      <!-- top right: mustard -->
      <g transform="translate(66.6 41.4)">
        <use href="#sq" fill="url(#goldA)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#3A2A05"
              stroke-opacity="0.45" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
              stroke-width="1.1" stroke-linecap="round"/>
      </g>
      <!-- bottom left: mustard, dyed deeper -->
      <g transform="translate(41.4 66.6)">
        <use href="#sq" fill="url(#goldB)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#3A2A05"
              stroke-opacity="0.45" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFFFFF" stroke-opacity="0.42"
              stroke-width="1.1" stroke-linecap="round"/>
      </g>
      <!-- bottom right: the one turned -->
      <g transform="translate(66.6 66.6) rotate(25)">
        <use href="#sq" fill="url(#tealB)"/>
        <rect x="-5.9" y="-5.9" width="11.8" height="11.8" rx="1.8" fill="none" stroke="#08322C"
              stroke-opacity="0.5" stroke-width="1.35" stroke-dasharray="2.7 2.4" stroke-linecap="round"/>
        <path d="M-9.9 -7a3.4 3.4 0 0 1 3.4-3.4h13" fill="none" stroke="#FFFFFF" stroke-opacity="0.55"
              stroke-width="1.1" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- The silhouette Android themes fill with a single colour, so the gaps carry the whole idea:
       four patches with real air between them, and the fourth clearly turned. -->
  <g id="mono" fill="#000">
    <rect x="30.6" y="30.6" width="19.4" height="19.4" rx="3.4"/>
    <rect x="58" y="30.6" width="19.4" height="19.4" rx="3.4"/>
    <rect x="30.6" y="58" width="19.4" height="19.4" rx="3.4"/>
    <g transform="translate(67.7 67.7) rotate(29)"><rect x="-9.7" y="-9.7" width="19.4" height="19.4" rx="3.4"/></g>
  </g>
</svg>
